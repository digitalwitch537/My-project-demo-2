name: mern-aiops

services:
  aiops:
    build:
      context: .
    container_name: mern-aiops
    restart: unless-stopped
    environment:
      AIOPS_CONFIG: /app/config.yml
      AIOPS_DATA_DIR: /app/data
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      GRAFANA_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      AI_MODEL_ENABLED: ${AI_MODEL_ENABLED:-true}
      AI_MODEL_URL: ${AI_MODEL_URL:-http://ai-model:8090}
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-5}
      AI_MODEL_WINDOW_SECONDS: ${AI_MODEL_WINDOW_SECONDS:-360}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_DRY_RUN: ${SLACK_DRY_RUN:-false}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  observability:
    external: true
    name: mern-observability_observability
