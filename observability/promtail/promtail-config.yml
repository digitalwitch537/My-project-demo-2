server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values:
              - running
          - name: name
            values:
              - mern-frontend
              - mern-backend
              - mern-mongo
    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: "/(.*)"
        target_label: container
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        target_label: project
    pipeline_stages:
      - match:
          selector: '{container="mern-frontend", stream="stdout"}'
          stages:
            - json:
                expressions:
                  status: status
                  method: method
                  request_time: request_time
            - labels:
                status:
                method:

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log
