name: secure-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  sonarqube:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'mern-crash-course' }}

      - name: SonarQube quality gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

  sca:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: .odc-data
          key: odc-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            odc-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p reports .odc-data
          args=(
            --scan /src
            --exclude '**/node_modules/**'
            --exclude '**/.git/**'
            --exclude '**/.odc-data/**'
            --exclude '**/reports/**'
            --format ALL
            --project mern-crash-course
            --out /report
            --enableExperimental
          )
          if [ -n "${NVD_API_KEY:-}" ]; then
            args+=(--nvdApiKey "$NVD_API_KEY")
          fi
          docker run --rm \
            -e NVD_API_KEY \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/src" \
            -v "$PWD/.odc-data:/usr/share/dependency-check/data" \
            -v "$PWD/reports:/report" \
            owasp/dependency-check:13.0.0 \
            "${args[@]}"

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn

  docker-security:
    name: Dockerfile and source scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint backend
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: Hadolint frontend
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

      - name: Trivy config scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
          output: trivy-config.txt
          skip-dirs: node_modules,frontend/node_modules,dist,frontend/dist
          timeout: 10m

      - name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-fs.txt
          skip-dirs: node_modules,frontend/node_modules,dist,frontend/dist
          timeout: 10m

      - name: Print Trivy reports
        if: always()
        run: |
          cat trivy-config.txt 2>/dev/null || true
          cat trivy-fs.txt 2>/dev/null || true

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.txt
          retention-days: 30
          if-no-files-found: warn

  build-push:
    name: Build, scan, and push images
    runs-on: ubuntu-latest
    needs: [quality, sonarqube, sca, docker-security]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/mern-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/mern-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy backend image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-image-backend.txt
          timeout: 10m

      - name: Trivy frontend image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-image-frontend.txt
          timeout: 10m

      - name: Print Trivy image reports
        if: always()
        run: |
          cat trivy-image-backend.txt 2>/dev/null || true
          cat trivy-image-frontend.txt 2>/dev/null || true

      - name: Upload Trivy image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: trivy-image-*.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Docker Scout backend
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          only-severities: critical,high
          exit-code: false
          write-comment: false
          summary: true

      - name: Docker Scout frontend
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          only-severities: critical,high
          exit-code: false
          write-comment: false
          summary: true

      - name: Backend SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-backend.cdx.json

      - name: Frontend SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-frontend.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 30
          if-no-files-found: warn

      - name: Push images
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag "$BACKEND_IMAGE:$GITHUB_SHA" "$BACKEND_IMAGE:latest"
          docker tag "$FRONTEND_IMAGE:$GITHUB_SHA" "$FRONTEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
          docker push "$BACKEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/mern
          overwrite: true

      - name: Pull, scan, and restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            cd /opt/mern
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            trap 'docker logout >/dev/null 2>&1 || true' EXIT
            export IMAGE_TAG="${IMAGE_TAG:?IMAGE_TAG is required}"
            docker compose -f docker-compose.prod.yml pull
            trivy image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed "$DOCKERHUB_USERNAME/mern-backend:$IMAGE_TAG" | tee /opt/mern/trivy-backend.txt || true
            trivy image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed "$DOCKERHUB_USERNAME/mern-frontend:$IMAGE_TAG" | tee /opt/mern/trivy-frontend.txt || true
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120 --remove-orphans
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
